# Render blueprint. Point Render at this repo (New > Blueprint) and it stands the
# site up with these settings, no dashboard fiddling.
services:
  - type: web
    name: greatojies
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Match the Node the site is developed and built against locally, so a
      # future default bump on Render's side cannot break the build on its own.
      - key: NODE_VERSION
        value: "20"

    # Single-page app: every path serves index.html so a deep link or a refresh
    # on /#about does not 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything under /assets, so it can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
